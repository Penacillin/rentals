<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NYC rental catalog — dual-source verified</title><style>
:root{--ink:#e8eeea;--ink-soft:#a5b1ab;--paper:#111614;--surface:#1b211e;--rule:#39433d;--band:#202925;--deal:#8dccaa;--deal-bg:#173525;--warn:#e6ad76;--blue:#83b7d8;--blue-bg:#183242;--bad:#f08b8b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}.wrap{max-width:1500px;margin:0 auto;padding:28px 18px 60px}header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px}h1{font-size:clamp(26px,5vw,38px);line-height:1.1;margin:0 0 6px;font-weight:600}.sub{color:var(--ink-soft);font-size:14px;margin:0;max-width:110ch}.stats{display:flex;flex-wrap:wrap;gap:22px;margin:18px 0 22px;padding:14px 0;border-bottom:1px solid var(--rule)}.stat b{display:block;font-size:22px;font-weight:600}.stat span{font-size:12px;color:var(--ink-soft)}.method{margin:18px 0;padding:12px 14px;border:1px solid var(--rule);background:var(--surface);font-size:13px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}input,select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink)}input[type=search]{flex:1 1 240px}.count{font-size:13px;color:var(--ink-soft);margin-left:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}th{background:var(--band);font-size:11px;color:var(--ink-soft);position:sticky;top:0;white-space:nowrap;cursor:pointer}td.num{text-align:right;white-space:nowrap}.src{min-width:185px;max-width:250px}.src a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}.mini{display:block;color:var(--ink-soft);font-size:11px;margin-top:2px}.pill{display:inline-block;font-size:10px;padding:1px 5px;border-radius:2px;background:var(--blue-bg);color:var(--blue)}.agree{background:var(--deal-bg);color:var(--deal)}.disc{background:#4a2824;color:var(--bad)}.warn{color:var(--warn)}.dash{color:#758079}.cards{display:none}.card{border:1px solid var(--rule);background:var(--surface);padding:13px;margin-bottom:10px}.card h3{margin:0}.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.card dt{color:var(--ink-soft)}.card dd{margin:0}footer{margin-top:32px;padding-top:14px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-soft);max-width:100ch}@media(max-width:900px){table{display:none}.cards{display:block}.count{width:100%;margin-left:0}}
</style></head><body><div class="wrap">
<header><h1>NYC rentals</h1><p class="sub">$4,000–$7,000 · 1–2 bedrooms · centered on 360 Park Avenue South.</p></header>
<div class="stats" id="stats"></div>
<div class="controls"><input type="search" id="q" placeholder="Search address, area, or source status"><select id="area"><option value="">All areas</option></select><select id="beds"><option value="">Any beds</option><option value="1">1 bed</option><option value="2">2 beds</option></select><select id="max"><option value="">Up to $7,000</option><option value="4500">Up to $4,500</option><option value="5000">Up to $5,000</option><option value="5500">Up to $5,500</option><option value="6000">Up to $6,000</option><option value="6500">Up to $6,500</option></select><select id="size"><option value="incl600">600+ sq ft (incl. unknown non-studios)</option><option value="incl700">700+ sq ft (incl. unknown non-studios)</option><option value="only600">600+ sq ft (confirmed only)</option><option value="only700">700+ sq ft (confirmed only)</option><option value="all">All sizes</option></select><select id="year"><option value="">Any build year</option><option value="postwar">Hide postwar 1950–1989</option><option value="lead">Hide pre-1978</option><option value="known">Only known years</option></select><select id="verify"><option value="">All source statuses</option><option value="Exact both — values agree">Exact both — agree</option><option value="Exact both — discrepancy">Exact both — discrepancy</option></select><span class="count" id="count"></span></div>
<div class="controls"><strong>Deal score</strong><label>Sort <select id="scoreMode"><option value="price">Price</option><option value="score">Deal score</option></select></label><label>Price (lower) <input data-score="price" type="number" min="0" step="0.5" value="5"></label><label>Sq ft (higher) <input data-score="sqft" type="number" min="0" step="0.5" value="3"></label><label>Transit (shorter) <input data-score="transit" type="number" min="0" step="0.5" value="3"></label><label>Doorman <input data-score="doorman" type="number" min="0" step="0.5" value="1"></label><label>Elevator <input data-score="elevator" type="number" min="0" step="0.5" value="1"></label><label>Dishwasher <input data-score="dishwasher" type="number" min="0" step="0.5" value="1"></label><label>Washer/dryer <input data-score="washerDryer" type="number" min="0" step="0.5" value="1"></label><label>Central air <input data-score="centralAir" type="number" min="0" step="0.5" value="1"></label><span>Higher score = better deal</span></div>
<table><thead><tr><th data-k="address">Address</th><th data-k="area">Area</th><th data-k="built" class="num">Built</th><th data-k="price" class="num">Catalog rent</th><th data-k="score" class="num">Deal score</th><th data-k="beds" class="num">Beds</th><th data-k="baths" class="num">Baths</th><th data-k="sqft" class="num">Sq ft</th><th data-k="days" class="num">Days on market</th><th>StreetEasy</th><th>Zillow</th><th data-k="verification">Source status</th></tr></thead><tbody id="rows"></tbody></table><div class="cards" id="cards"></div>
<script>const D={{DATA}};
const money=n=>n==null?'—':'$'+Math.round(n).toLocaleString();const val=n=>n==null?'—':n.toLocaleString();const areas=[...new Set(D.map(r=>r.area))].sort();document.getElementById('area').innerHTML='<option value="">All areas</option>'+areas.map(x=>`<option>${x}</option>`).join('');
function buildingAddress(address){return address.replace(/\s+(?:APT|Apt|apt|Unit|UNIT|unit|Floor|FLOOR|floor|Penthouse|PENTHOUSE|penthouse|PH|Ph|ph)\s+.*$/,'').replace(/\s+#.*$/,'').trim()}
function listingAge(value){if(value==null)return'—';if(/^\d+(?:\.\d+)?$/.test(value))return value+' days ago';let date=Date.parse(value);if(Number.isNaN(date))return value;let days=Math.max(0,Math.floor((Date.now()-date)/86400000));return days?days+' days ago':'today'}
function daysNumber(value){if(value==null)return null;if(/^\d+(?:\.\d+)?$/.test(value))return Math.max(0,Math.floor(Number(value)));let date=Date.parse(value);if(Number.isNaN(date)){let match=String(value).match(/(\d+)\s+days?\s+ago/i);return match?Number(match[1]):null}return Math.max(0,Math.floor((Date.now()-date)/86400000))}
function daysOnMarket(value){let days=daysNumber(value);return days==null?'—':days}
function srcbox(s,name,address){let bits=[];if(s.price!=null)bits.push(money(s.price));if(s.beds!=null)bits.push(s.beds+' bd');if(s.baths!=null)bits.push(s.baths+' ba');if(s.sqft!=null)bits.push(val(s.sqft)+' ft²');if(s.listedAt!=null)bits.push('Listed '+listingAge(s.listedAt));let href,label,linknote;if(name==='StreetEasy'){if(s.url&&s.url!=='https://streeteasy.com/'){href=s.url;label='StreetEasy unit';linknote='Exact/unit record'}else if(s.buildingUrl){href=s.buildingUrl;label='StreetEasy building';linknote='Building resolved; unit not found'}else{let a=buildingAddress(address);href=`https://streeteasy.com/search?search=${encodeURIComponent(a)}`;label='Search StreetEasy';linknote='Address-only search fallback'}}else{let exact=!!(s.url&&s.url!=='https://www.zillow.com/');href=exact?s.url:`https://www.zillow.com/homes/${encodeURIComponent(address+' NY')}_rb/`;label=exact?'Zillow unit':'Search Zillow';linknote=exact?'Exact/unit record':'Address search fallback'}let head=`<a href="${href}" target="_blank" rel="noopener">${label}</a>`;return `<div class="src">${head}${bits.length?' · '+bits.join(' · '):''}<span class="mini">${linknote}</span><span class="mini">${s.status||''}</span>${s.note?`<span class="mini warn">${s.note}</span>`:''}</div>`}
function flagged(r){return r.built!=null&&r.built>=1950&&r.built<=1989}function stats(list){document.getElementById('stats').innerHTML=[[list.length,'listings'],[list.filter(r=>r.built!=null).length,'known build years'],[list.filter(r=>r.verification==='Exact both — values agree').length,'exact source agreements'],[list.filter(r=>r.verification==='Exact both — discrepancy').length,'exact discrepancies']].map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}
function commute(r){if(r.walkMinutes==null&&r.transitMinutes==null)return '';let date=r.commuteDate?` · ${r.commuteDate}`:'';return `<span class="mini">Walk ${r.walkMinutes==null?'—':r.walkMinutes+' min'} · Transit ${r.transitMinutes==null?'—':r.transitMinutes+' min'} at 9:30 AM${date}</span>`}
function featureText(r){let names={centralAir:'central air',dishwasher:'dishwasher',washerDryer:'washer/dryer',doorman:'doorman',elevator:'elevator'};let found=Object.keys(names).filter(k=>r.features&&r.features[k]);return found.length?`<span class="mini">Features: ${found.map(k=>names[k]).join(', ')}</span>`:''}
function badge(v,r){let c=v.includes('agree')?'agree':v.includes('discrepancy')?'disc':'';return `<span class="pill ${c}">${v}</span>${r?commute(r)+featureText(r):''}`}
function dealScore(r){let values={price:r.price==null?0:Math.max(0,Math.min(1,(7000-r.price)/3000)),sqft:r.sqft==null?0:Math.min(1,r.sqft/1200),transit:r.transitMinutes==null?0:Math.max(0,1-r.transitMinutes/60),doorman:r.features?.doorman?1:0,elevator:r.features?.elevator?1:0,dishwasher:r.features?.dishwasher?1:0,washerDryer:r.features?.washerDryer?1:0,centralAir:r.features?.centralAir?1:0};let total=0,max=0;for(let [key,value] of Object.entries(values)){let weight=Number(document.querySelector(`[data-score="${key}"]`).value)||0;total+=weight*value;max+=weight}return max?Math.round(total/max*100):0}
let sortKey='price',sortDir=1;function render(){let q=document.getElementById('q').value.toLowerCase(),area=document.getElementById('area').value,b=document.getElementById('beds').value,mx=document.getElementById('max').value,sz=document.getElementById('size').value,yr=document.getElementById('year').value,ver=document.getElementById('verify').value,mode=document.getElementById('scoreMode').value;D.forEach(r=>r.score=dealScore(r));let list=D.filter(r=>{let hay=(r.address+' '+r.area+' '+r.verification+' '+r.streeteasy.status+' '+r.zillow.status).toLowerCase();if(q&&!hay.includes(q))return false;if(area&&r.area!==area)return false;if(b&&r.beds!==+b)return false;if(mx&&r.price>+mx)return false;if(ver&&r.verification!==ver)return false;if(yr==='postwar'&&flagged(r))return false;if(yr==='lead'&&r.built!=null&&r.built<1978)return false;if(yr==='known'&&r.built==null)return false;if(sz!=='all'){let min=sz.endsWith('700')?700:600;if(sz.startsWith('only')){if(!(r.sqft>=min))return false}else{if(r.sqft!=null&&r.sqft<min) return false;if(r.sqft==null&&r.beds===0)return false}}return true});let order=mode==='score'||sortKey==='score'?'score':sortKey;list.sort((a,b)=>{let x=order==='days'?daysNumber(a.listedAt):a[order],y=order==='days'?daysNumber(b.listedAt):b[order];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;return order==='score'?y-x:(typeof x==='string'?x.localeCompare(y):x-y)*sortDir});stats(list);document.getElementById('count').textContent=list.length+' of '+D.length+' shown';document.getElementById('rows').innerHTML=list.map(r=>`<tr><td>${r.address}</td><td>${r.area}</td><td class="num">${r.built==null?'—':(flagged(r)?`<span class="warn">${r.built}</span>`:r.built)}</td><td class="num">${money(r.price)}</td><td class="num">${r.score}</td><td class="num">${r.beds}</td><td class="num">${r.baths}</td><td class="num">${r.sqft==null?'—':val(r.sqft)}</td><td class="num">${daysOnMarket(r.listedAt)}</td><td>${srcbox(r.streeteasy,'StreetEasy',r.address)}</td><td>${srcbox(r.zillow,'Zillow',r.address)}</td><td>${badge(r.verification,r)}</td></tr>`).join('');document.getElementById('cards').innerHTML=list.map(r=>`<div class="card"><h3>${r.address}</h3><div class="mini">${r.area}</div><dl><dt>Catalog</dt><dd>${money(r.price)} · ${r.beds} bd · ${r.baths} ba · ${r.sqft==null?'—':val(r.sqft)+' ft²'}</dd><dt>Built</dt><dd>${r.built??'—'}</dd><dt>StreetEasy</dt><dd>${srcbox(r.streeteasy,'StreetEasy',r.address)}</dd><dt>Zillow</dt><dd>${srcbox(r.zillow,'Zillow',r.address)}</dd><dt>Status</dt><dd>${badge(r.verification,r)}</dd></dl></div>`).join('')}document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{let k=th.dataset.k;if(k===sortKey)sortDir*=-1;else{sortKey=k;sortDir=1}render()});['q','area','beds','max','size','year','verify'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.getElementById('scoreMode').addEventListener('change',render);document.querySelectorAll('[data-score]').forEach(input=>input.addEventListener('input',render));render();</script></body></html>
