[project]
name = "rentals"
version = "0.1.0"
description = "NYC rental data pipeline"
requires-python = ">=3.12"
dependencies = [
    "invisible-playwright>=0.14.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.7",
    "ty>=0.0.81",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
per-file-ignores = {"tests/*.py" = ["E402"]}

[tool.ty.environment]
python-version = "3.12"
