function badge(v,r){let c=v.includes('agree')?'agree':v.includes('discrepancy')?'disc':'';return `<span class="pill ${c}">${v}</span>${r?commute(r)+featureText(r):''}`}
function dealScore(r){let values={price:r.price==null?0:Math.max(0,Math.min(1,(7000-r.price)/3000)),sqft:r.sqft==null?0:Math.min(1,r.sqft/1200),transit:r.transitMinutes==null?0:Math.max(0,1-r.transitMinutes/60),doorman:r.features?.doorman?1:0,elevator:r.features?.elevator?1:0,dishwasher:r.features?.dishwasher?1:0,washerDryer:r.features?.washerDryer?1:0,centralAir:r.features?.centralAir?1:0};let total=0,max=0;for(let [key,value] of Object.entries(values)){let weight=Number(document.querySelector(`[data-score="${key}"]`).value)||0;total+=weight*value;max+=weight}return max?Math.round(total/max*100):0}
let sortKey='price',sortDir=1;function render(){let q=document.getElementById('q').value.toLowerCase(),area=document.getElementById('area').value,b=document.getElementById('beds').value,mx=document.getElementById('max').value,sz=document.getElementById('size').value,yr=document.getElementById('year').value,ver=document.getElementById('verify').value,mode=document.getElementById('scoreMode').value;D.forEach(r=>r.score=dealScore(r));let list=D.filter(r=>{let hay=(r.address+' '+r.area+' '+r.verification+' '+r.streeteasy.status+' '+r.zillow.status).toLowerCase();if(q&&!hay.includes(q))return false;if(area&&r.area!==area)return false;if(b&&r.beds!==+b)return false;if(mx&&r.price>+mx)return false;if(ver&&r.verification!==ver)return false;if(yr==='postwar'&&flagged(r))return false;if(yr==='lead'&&r.built!=null&&r.built<1978)return false;if(yr==='known'&&r.built==null)return false;if(sz!=='all'){let min=sz.endsWith('700')?700:600;if(sz.startsWith('only')){if(!(r.sqft>=min))return false}else{if(r.sqft!=null&&r.sqft<min) return false;if(r.sqft==null&&r.beds===0)return false}}return true});list.sort((a,b)=>{let x=a[mode==='score'?'score':sortKey],y=b[mode==='score'?'score':sortKey];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;return mode==='score'?y-x:(typeof x==='string'?x.localeCompare(y):x-y)*sortDir});stats(list);document.getElementById('count').textContent=list.length+' of '+D.length+' shown';document.getElementById('rows').innerHTML=list.map(r=>`<tr><td>${r.address}</td><td>${r.area}</td><td class="num">${r.built==null?'—':(flagged(r)?`<span class="warn">${r.built}</span>`:r.built)}</td><td class="num">${money(r.price)}</td><td class="num">${r.score}</td><td class="num">${r.beds}</td><td class="num">${r.baths}</td><td class="num">${r.sqft==null?'—':val(r.sqft)}</td><td class="num">${daysOnMarket(r.listedAt)}</td><td>${srcbox(r.streeteasy,'StreetEasy',r.address)}</td><td>${srcbox(r.zillow,'Zillow',r.address)}</td><td>${badge(r.verification,r)}</td></tr>`).join('');document.getElementById('cards').innerHTML=list.map(r=>`<div class="card"><h3>${r.address}</h3><div class="mini">${r.area}</div><dl><dt>Catalog</dt><dd>${money(r.price)} · ${r.beds} bd · ${r.baths} ba · ${r.sqft==null?'—':val(r.sqft)+' ft²'}</dd><dt>Built</dt><dd>${r.built??'—'}</dd><dt>StreetEasy</dt><dd>${srcbox(r.streeteasy,'StreetEasy',r.address)}</dd><dt>Zillow</dt><dd>${srcbox(r.zillow,'Zillow',r.address)}</dd><dt>Status</dt><dd>${badge(r.verification,r)}</dd></dl></div>`).join('')}document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{let k=th.dataset.k;if(k===sortKey)sortDir*=-1;else{sortKey=k;sortDir=1}render()});['q','area','beds','max','size','year','verify','scoreMode'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.querySelectorAll('[data-score]').forEach(input=>input.addEventListener('input',render));render();</script></body></html>
